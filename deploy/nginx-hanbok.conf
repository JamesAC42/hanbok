# /etc/nginx/sites-available/hanbokstudy.com  (ln -s into sites-enabled)
# Then: sudo certbot --nginx -d hanbokstudy.com -d www.hanbokstudy.com
# If the site is behind Cloudflare, also include /etc/nginx/cloudflare-real-ip.conf
# (set_real_ip_from for each Cloudflare range + real_ip_header CF-Connecting-IP)
# so the API sees visitors' IPs for rate limits.

server {
    listen 80;
    server_name hanbokstudy.com www.hanbokstudy.com;

    if ($host = www.hanbokstudy.com) {
        return 301 https://hanbokstudy.com$request_uri;
    }

    client_max_body_size 25m;

    # Unauthenticated debug routes in server/index.js; never reachable from outside.
    # Case-insensitive because Express routes match /api/DEBUG/... too.
    location ~* ^/api/debug(/|$) {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (extended text progress)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3059;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
