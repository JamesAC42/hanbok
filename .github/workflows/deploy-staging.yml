name: Deploy to staging

# Puts any PR, branch or commit on staging.hanbokstudy.com so it can be tried
# before merging. Manual only. Builds the same images as production (tagged by
# commit) and has the server run them in /srv/hanbok-staging
# (deploy/staging/, compose-entry.sh's staging-* commands).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: PR number (deploys the PR as it would look merged into main), or a branch, tag or commit SHA
        required: true
      action:
        description: rollback swaps staging back to its previous build without rebuilding
        type: choice
        options: [deploy, rollback]
        default: deploy

# One staging deploy at a time; production deploys don't wait on these.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve ref
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$REF" =~ ^#?[0-9]+$ ]]; then
            echo "ref=refs/pull/${REF#\#}/merge" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - id: sha
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$REF\` ($(git log -1 --format='%h %s')) to https://staging.hanbokstudy.com" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/jamesac42/hanbok-api:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=api
      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ghcr.io/jamesac42/hanbok-app:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=app

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || inputs.action == 'rollback')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.hanbokstudy.com
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          COMMAND: ${{ needs.build.result == 'success' && format('staging-deploy {0}', needs.build.outputs.sha) || 'staging-rollback' }}
        # Same forced-command key as production; compose-entry.sh sends
        # staging-* commands to /srv/hanbok-staging only.
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$COMMAND"
